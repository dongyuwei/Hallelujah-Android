name: Android CI

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed by the automatic pre-release step

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # full history and tags, for the release changelog range
    - name: set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports
        path: app/build/reports/tests/

    - name: Build debug APK
      run: ./gradlew assembleDebug

    - name: Upload debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub pre-release
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        SHA="$(git rev-parse --short HEAD)"
        TAG="build-${SHA}"
        TITLE="Automated build $(date '+%Y-%m-%d %H:%M') (${SHA})"

        # Release asset: Hallelujah-<timestamp>-<short-SHA>-debug.apk
        STAMP="$(date '+%Y%m%d-%H%M')"
        APK_DEBUG="Hallelujah-${STAMP}-${SHA}-debug.apk"
        cp app/build/outputs/apk/debug/app-debug.apk "$APK_DEBUG"

        # Commit subjects since the previous release tag (excluding this
        # commit's own tag, so workflow re-runs don't produce an empty range)
        RANGE="HEAD"
        for t in $(git tag --sort=-creatordate); do
          if [ "$t" != "$TAG" ]; then RANGE="${t}..HEAD"; break; fi
        done
        CHANGELOG="$(git log --pretty=format:'%s' "$RANGE" | head -n 30)"

        NOTES="Automated release built from commit ${SHA}."
        if [ -n "$CHANGELOG" ]; then
          NOTES="$(printf '%s\n\n%s' "$NOTES" "$CHANGELOG")"
        fi

        # Replace any existing release for this commit (e.g. on workflow re-run)
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release delete "$TAG" --yes --cleanup-tag
        fi

        gh release create "$TAG" "$APK_DEBUG" \
          --title "$TITLE" \
          --notes "$NOTES" \
          --prerelease
