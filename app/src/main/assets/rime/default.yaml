# Rime default settings for Hallelujah-Android
# Based on rime-prelude default.yaml, trimmed to the luna_pinyin_simp
# (朙月拼音·简化字) schema only, with a candidate page sized for the
# keyboard's candidate bar.
# encoding: utf-8

config_version: '1.0'

schema_list:
  - schema: luna_pinyin_simp

switcher:
  caption: 〔方案選單〕
  hotkeys:
    - Control+grave
  save_options:
    - full_shape
    - ascii_punct
    - simplification
    - extended_charset
    - zh_hant
    - zh_hans
    - zh_hant_tw
  fold_options: true
  abbreviate_options: true
  option_list_separator: '／'

menu:
  page_size: 9

punctuator:
  full_shape:
    __include: punctuation:/full_shape
  half_shape:
    __include: punctuation:/half_shape

key_binder:
  bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/paging_with_comma_period
      - key_bindings:/numbered_mode_switch

selector:
  __patch:
    bindings:
      __include: key_bindings:/rotate_candidate_with_tab
    linear/bindings:
      __include: key_bindings:/rotate_candidate_with_tab
    vertical/bindings:
      __include: key_bindings:/rotate_candidate_with_tab
    vertical/linear/bindings:
      __include: key_bindings:/rotate_candidate_with_tab

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear
