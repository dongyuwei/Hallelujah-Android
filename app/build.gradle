apply plugin: 'com.android.application'

android {
    defaultConfig {
        applicationId "rkr.tinykeyboard.inputmethod"
        compileSdk 34
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 8
        versionName "0.8"
    }
    buildTypes {
        release {
            minifyEnabled true
            // Sideloading distribution via GitHub releases: sign releases with
            // the debug key so the APK installs without a release keystore.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'rkr.tinykeyboard.inputmethod'

    testOptions {
        unitTests.all {
            testLogging {
                events 'passed', 'failed'
                showStandardStreams true
            }
        }
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'

    testImplementation 'junit:junit:4.13.2'
    // Runs the real dictionary SQL against the bundled .sqlite3 assets on the JVM.
    testImplementation 'org.xerial:sqlite-jdbc:3.45.3.0'
}
