apply plugin: 'com.android.application'

android {
    defaultConfig {
        applicationId "rkr.tinykeyboard.inputmethod"
        compileSdk 34
        // endive uses JDK APIs from Android API 30 (Objects.requireNonNullElse)
        // and reads wasm via InputStream.readAllBytes (API 33, avoided: we pass
        // a byte[]); API 30 is the effective floor for the rime engine.
        minSdkVersion 30
        targetSdkVersion 34
        versionCode 8
        versionName "0.8"
    }
    buildTypes {
        release {
            minifyEnabled true
            // Sideloading distribution via GitHub releases: sign releases with
            // the debug key so the APK installs without a release keystore.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'rkr.tinykeyboard.inputmethod'

    packagingOptions {
        // run.endive:runtime and run.endive:wasm both ship these
        pickFirst 'THIRD-PARTY.txt'
        pickFirst 'logging.properties'
        exclude 'META-INF/jpms.args'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // the wasm engine tests hold a large heap for rime's memory
                maxHeapSize = "3g"
                testLogging {
                    events 'passed', 'failed'
                    showStandardStreams true
                }
            }
        }
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    // Pure-JVM WebAssembly runtime for the rime engine (app/src/main/assets/rime).
    implementation 'run.endive:runtime:1.1.0'
    implementation 'run.endive:wasm:1.1.0'

    testImplementation 'junit:junit:4.13.2'
    // Runs the real dictionary SQL against the bundled .sqlite3 assets on the JVM.
    testImplementation 'org.xerial:sqlite-jdbc:3.45.3.0'
    // Instantiates the real SoftKeyboard to test the pinyin mode-switch state machine.
    testImplementation 'org.robolectric:robolectric:4.11.1'
}
